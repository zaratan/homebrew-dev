name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: brew style
        run: brew style zaratan/dev

      - name: brew audit (formulae)
        # --except=version: audit_version rejects an explicit `version` that
        # matches the one it can scan from the url. bump-formulae.yml needs
        # both — it rewrites the version line and interpolates #{version} into
        # the url pattern — so the two tools cannot both be satisfied here.
        run: brew audit --formula --strict --except=version --tap zaratan/dev

